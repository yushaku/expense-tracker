packages:
  - 'apps/*'
  - 'packages/*'

# Expo/Metro: flat node_modules (symlink store breaks web bundle URL)
nodeLinker: hoisted

# Native/postinstall scripts required by deps
allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@expo/cli@54.0.27'
  - expo-constants@18.0.14
  - expo-file-system@19.0.24
  - expo-modules-autolinking@3.0.27
  - expo@54.0.37
